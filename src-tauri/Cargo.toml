[package]
authors = ["Sebastien Rousseau"]
build = "build.rs"
categories = [
    "cryptography",
    "text-processing"
]
default-run = "password-generator-pro"
description = "A Fast, Simple And Secure Password Generator"
edition = "2021"
homepage = "https://password-generator.pro"
keywords = [
    "open-source",
    "password-generator",
    "password-protection",
    "secure-password",
    "rust-password-generator",
]
license = "MIT OR Apache-2.0"
name = "password-generator-pro"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/password-generator-pro"
rust-version = "1.77"
version = "0.0.7"

[lib]
# A library plus a thin binary: integration tests cannot link against a
# bin-only crate, which is why the menu/tray/dispatch code had no
# coverage under Tauri 1.
name = "password_generator_pro"
path = "src/lib.rs"

[[bin]]
name = "password-generator-pro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
bcrypt = "0.15.0"
cli-clipboard = "0.4.0"
cmn = "0.0.3"
convert_case = "0.6.0"
psph = "0.0.1"
qrcode = "0.13.0"
serde = { version = "1.0.193", features = ["derive"] }
svg = "0.14.0"
tauri = { version = "2.11", features = ["tray-icon", "image-ico", "image-png"] }
# Dialogs moved out of core into a plugin in Tauri 2.
tauri-plugin-dialog = "2.7"
# The webview calls writeText (src-web/App.svelte); in Tauri 1 that
# was the `clipboard` allowlist entry, in Tauri 2 it is a plugin.
tauri-plugin-clipboard-manager = "2"
time = "0.3.31"
webbrowser = "0.8.12"

[dependencies.uuid]
version = "1.6.1"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]

[package.metadata.bundle]
name = "Password Generator Pro"
identifier = "com.sebastienrousseau.password-generator-pro"

[[test]]
# muda refuses to build a menu off the main thread on macOS, and the
# default harness runs every test on a spawned thread. harness = false
# makes this file's `main` the test binary, which runs on the main
# thread.
name = "menu_construction"
path = "tests/menu_construction.rs"
harness = false

[dev-dependencies]
# `test` gives us tauri::test::mock_builder(), a headless runtime.
# Without it the menu, tray and dispatch code can only be exercised
# by launching a real window, so it went untested under Tauri 1.
tauri = { version = "2.11", features = ["test"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
# Criterion supplies its own harness.
name = "generation"
path = "benches/generation.rs"
harness = false
