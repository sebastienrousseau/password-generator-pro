name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust backend CI lives in `rust.yml`, not in the shared pipeline.
  #
  # The shared `rust-ci.yml` runs cargo on a bare ubuntu runner and
  # takes no system-package input, so it cannot build a GTK/webkit
  # crate:
  #
  #     The system library `glib-2.0` required by crate `glib-sys` was
  #     not found.
  #
  # It failed on every run for that reason, never having compiled this
  # project. `rust.yml` installs the webkit2gtk 4.1 stack first and
  # gates on fmt, clippy, the full workspace test run and the
  # benchmarks, on both ubuntu and macOS.

  # TypeScript/Svelte frontend CI
  node-ci:
    name: Node CI
    uses: sebastienrousseau/pipelines/.github/workflows/node-ci.yml@main
    with:
      node-version: '22'
      package-manager: 'pnpm'
      run-lint: true
      run-typecheck: true
      run-tests: true
      # `pnpm build` is `tauri build`, which needs the webkit2gtk stack
      # this runner does not have. The application build is rust.yml's
      # job; node-ci covers lint, types, tests and coverage.
      run-build: false
      test-coverage: true
    secrets: inherit
