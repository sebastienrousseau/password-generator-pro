name: 🧪 Audit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  dependencies:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cargo audit` reads Cargo.lock, which lives at the workspace
      # root. This step used to run `cd src-tauri && cargo audit` from a
      # time when the crate carried its own lockfile, and now fails with
      #
      #     error: not found: Couldn't load Cargo.lock
      #
      # It also installed cargo-audit before checking out, and pinned an
      # unmaintained toolchain action.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
