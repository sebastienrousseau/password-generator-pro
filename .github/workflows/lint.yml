name: 🧪 Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: ✅ Checkout code (main branch)
        uses: actions/checkout@v4

      - name: ✅ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # No `version:` here -- pnpm/action-setup reads
          # `packageManager` from package.json, so CI and a local
          # install cannot drift. Pinning 8 is what hid the fact
          # that pnpm 10+ ignores `pnpm.overrides`.
          run_install: false

      - name: ✅ Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: ✅ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: ✅ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: ✅ Remove node_modules
        run: rm -rf node_modules

      - name: ✅ Install dependencies
        run: pnpm install

      - name: ✅ Linting
        run: pnpm run lint:web
