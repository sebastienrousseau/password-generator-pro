# pnpm workspace configuration.
#
# This is a single-package repository, not a monorepo -- the file exists
# because pnpm 10+ reads `overrides` and `allowBuilds` from here rather
# than from package.json. pnpm still requires `packages`, so it names the
# root and nothing else.
packages:
  - "."

# pnpm workspace configuration.
#
# `overrides` lives here, not in package.json's `pnpm` field. pnpm 10
# stopped reading that field and says so only as a warning:
#
#   The "pnpm" field in package.json is no longer read by pnpm.
#   The following keys were ignored: "pnpm.overrides"
#
# Every entry below is a transitive security pin. Left in the old
# location they were silently inert for anyone on a current pnpm --
# CI pinned pnpm 8, where they still applied, so the gap only showed
# up off CI. `packageManager` in package.json now pins the version so
# the two cannot drift again.

# pnpm 10+ does not run dependency build scripts unless the package is
# allowed here. Both of these genuinely need theirs -- esbuild fetches
# its platform binary, svelte-preprocess compiles -- and without them
# `build:web` fails with ERR_PNPM_IGNORED_BUILDS. An explicit allowlist
# rather than disabling the check, so a new script-running dependency
# stays a visible decision.
allowBuilds:
  esbuild: true
  svelte-preprocess: true
overrides:
  "ajv@<6.14.0": ">=6.14.0 <7.0.0"
  "brace-expansion@<1.1.16": ">=1.1.16 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.2": ">=2.1.2 <3.0.0"
  "braces@<3.0.3": ">=3.0.3 <4.0.0"
  "cross-spawn@>=7.0.0 <7.0.5": ">=7.0.5 <8.0.0"
  "flatted@<=3.4.1": ">=3.4.2 <4.0.0"
  "glob@>=10.2.0 <10.5.0": ">=10.5.0 <11.0.0"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1 <5.0.0"
  "micromatch@<4.0.8": ">=4.0.8 <5.0.0"
  "minimatch@<3.1.3": ">=3.1.3 <4.0.0"
  "minimatch@>=9.0.0 <9.0.7": ">=9.0.7 <10.0.0"
  "yaml@>=2.0.0 <2.8.3": ">=2.8.3 <3.0.0"

